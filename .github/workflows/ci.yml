name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Localizaciones
        run: flutter gen-l10n

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      # Los valores salen de los secrets del repo; nunca se suben a git.
      - name: Configuración de build
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          jq -n \
            --arg api "$API_BASE_URL" \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_ANON_KEY" \
            '{API_BASE_URL: $api, SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' \
            > config/ci.json

      - name: APK release
        run: flutter build apk --release --dart-define-from-file=config/ci.json

      - uses: actions/upload-artifact@v4
        with:
          name: servired-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
